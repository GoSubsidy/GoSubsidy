<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================================================
         GoSubsidy Favicon & App Icons
         ========================================================= -->

    <!-- Browser favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/gosubsidy-gold-gr-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/gosubsidy-gold-gr-16.png"
    />

    <!-- Fallback favicon -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="/images/gosubsidy-gold-gr-32.png"
    />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/gosubsidy-handshake-180.png"
    />

    <!-- Android / PWA -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/gosubsidy-handshake-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/gosubsidy-handshake-512.png"
    />

    <!-- PWA theme -->
    <meta name="theme-color" content="#00a66a" />

    <!-- =========================================================
         SEO
         ========================================================= -->

    <meta
      name="description"
      content="GoSubsidy helps businesses discover government subsidies, loans, registrations, compliance services and detailed project reports."
    />

    <meta
      name="application-name"
      content="GoSubsidy"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="GoSubsidy"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- =========================================================
         Open Graph
         ========================================================= -->

    <meta
      property="og:title"
      content="GoSubsidy – Government Subsidies, Loans & Business Services"
    />

    <meta
      property="og:description"
      content="Discover government subsidies, business loans, registrations, compliance services and detailed project reports with GoSubsidy."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.gosubsidy.com/"
    />

    <meta
      property="og:site_name"
      content="GoSubsidy"
    />

    <meta
      property="og:image"
      content="https://www.gosubsidy.com/images/gosubsidy-public-logo.png"
    />

    <!-- =========================================================
         Page Title
         ========================================================= -->

    <title>
      GoSubsidy – Government Subsidies, Loans & Business Services
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
